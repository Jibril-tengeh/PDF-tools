name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: 📱 Compiler APK Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🟢 Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Configuration Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Acceptation des licences Android SDK
        run: yes | sdkmanager --licenses || true

      - name: 📦 Installation des dépendances npm
        run: npm install --legacy-peer-deps

      - name: 🔨 Compilation Web (Vite)
        run: npm run build

      - name: 🔄 Synchronisation Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 🔑 Droits d'exécution Gradle
        run: chmod +x android/gradlew

      - name: ⚡ Compilation de l'APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          mkdir -p ../build-outputs
          cp app/build/outputs/apk/debug/app-debug.apk ../build-outputs/PDF-Tools-debug.apk

      - name: 📤 Téléversement de l'APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Tools-Android-APK
          path: build-outputs/PDF-Tools-debug.apk
          if-no-files-found: error
          retention-days: 30
